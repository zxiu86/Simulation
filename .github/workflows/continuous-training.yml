name: Continuous Civilization Training & Checkpoint Sync

on:
  workflow_dispatch:
    inputs:
      simulation_id:
        description: 'Constant simulation timeline ID across runs'
        required: false
        default: 'civ-main-timeline'
      duration_minutes:
        description: 'Simulation duration in minutes (0 = use max_ticks instead)'
        required: false
        default: '5'
      checkpoint_interval_minutes:
        description: 'Backup checkpoint interval in minutes'
        required: false
        default: '2'
      max_ticks:
        description: 'Max ticks when duration_minutes is 0'
        required: false
        default: '160'
      train_episodes:
        description: 'Isolated training episodes before final checkpoint'
        required: false
        default: '8'

permissions:
  contents: read

jobs:
  evolve-and-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies cleanly
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Download previous checkpoint artifact if available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: civilization-data-${{ github.event.inputs.simulation_id || 'civ-main-timeline' }}
          path: data

      - name: Run Civilization Simulation & Chunked Checkpoints
        env:
          SIMULATION_ID: ${{ github.event.inputs.simulation_id || 'civ-main-timeline' }}
          TELEMETRY_ENDPOINT_URL: ${{ vars.TELEMETRY_ENDPOINT_URL }}
          TELEMETRY_INGEST_TOKEN: ${{ secrets.TELEMETRY_INGEST_TOKEN }}
        run: |
          npx tsx scripts/cli-runner.ts \
            --simulation-id="${{ github.event.inputs.simulation_id || 'civ-main-timeline' }}" \
            --duration-minutes="${{ github.event.inputs.duration_minutes || '5' }}" \
            --checkpoint-interval-minutes="${{ github.event.inputs.checkpoint_interval_minutes || '2' }}" \
            --ticks="${{ github.event.inputs.max_ticks || '160' }}" \
            --train-episodes="${{ github.event.inputs.train_episodes || '8' }}"

      - name: Upload updated chunked checkpoints and SQLite archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civilization-data-${{ github.event.inputs.simulation_id || 'civ-main-timeline' }}
          path: data/
          retention-days: 30
