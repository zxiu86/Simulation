name: Continuous Civilization Simulation & Training

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'مدة تشغيل المحاكاة بالدقائق (عند انتهائها يتوقف العمل ويحفظ آخر تطور ونقطة فحص)'
        required: false
        default: '10'
      checkpoint_interval_minutes:
        description: 'الفاصل الزمني بالدقائق لإنشاء نسخة احتياطية Checkpoint تلقائياً أثناء التشغيل'
        required: false
        default: '3'
      ticks:
        description: 'الحد الأقصى للدورات (0 = التشغيل طوال مدة duration_minutes المحددة)'
        required: false
        default: '0'
      train_episodes:
        description: 'حلقات التدريب المعزول في نهاية الجلسة'
        required: false
        default: '10'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: civilization-simulation-state
  cancel-in-progress: false

jobs:
  resumable-simulation-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Restore persistent simulation state cache
        uses: actions/cache@v4
        with:
          path: data
          key: civ-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            civ-state-${{ github.ref_name }}-

      - name: Run simulation & engine verification tests
        run: npm test

      - name: Run time-budgeted simulation with periodic checkpoint backups
        run: >
          npx tsx scripts/cli-runner.ts
          --duration-minutes=${{ github.event.inputs.duration_minutes || '10' }}
          --checkpoint-interval-minutes=${{ github.event.inputs.checkpoint_interval_minutes || '3' }}
          --ticks=${{ github.event.inputs.ticks || '0' }}
          --train-episodes=${{ github.event.inputs.train_episodes || '10' }}

      - name: Upload compressed checkpoints and brain packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civilization-checkpoints-${{ github.run_number }}
          path: |
            data/checkpoints/*.json.gz
            data/packages/*.json
          retention-days: 14
          if-no-files-found: warn
